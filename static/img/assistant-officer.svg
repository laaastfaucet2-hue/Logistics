<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="42" height="42" role="img"
     aria-label="ضابط — شعار المساعد المحلي">
  <!-- المساعد المحلي: شعار ضابط (كاب ذهبي + شارة + كتاف) بدل أيقونة الروبوت -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243044"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d3b1"/>
      <stop offset="1" stop-color="#e0b489"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- الكتفان والزي -->
  <path d="M6 62c1.4-8.8 8.4-15.2 17.4-17.4h17.2C49.6 46.8 56.6 53.2 58 62Z" fill="#111c2e"/>
  <!-- كتافتان بشارة نجمية -->
  <g>
    <g transform="rotate(-8 14 52)">
      <rect x="8.6" y="50" width="11" height="3.6" rx="1.2" fill="url(#gold)"/>
      <path d="M14.1 48.6l.8 1.6 1.7.3-1.2 1.2.3 1.7-1.6-.9-1.6.9.3-1.7-1.2-1.2 1.7-.3Z" fill="#0b1220"/>
    </g>
    <g transform="rotate(8 50 52)">
      <rect x="44.4" y="50" width="11" height="3.6" rx="1.2" fill="url(#gold)"/>
      <path d="M49.9 48.6l.8 1.6 1.7.3-1.2 1.2.3 1.7-1.6-.9-1.6.9.3-1.7-1.2-1.2 1.7-.3Z" fill="#0b1220"/>
    </g>
  </g>

  <!-- الرقبة -->
  <path d="M27 44h10v8h-10Z" fill="#d9a97c"/>
  <!-- الياقة البيضاء والرباط -->
  <path d="M32 50.6l3 4.2-3 6.4-3-6.4Z" fill="#b91c1c"/>
  <path d="M25.4 46.4 32 50.6l-6.6 2.2-3.4-4.4Z" fill="#f8fafc"/>
  <path d="M38.6 46.4 32 50.6l6.6 2.2 3.4-4.4Z" fill="#f8fafc"/>
  <path d="M18.4 62c.6-6.6 4-11.4 9.6-13.4l4 2-2.4 11.4Zm27.2 0c-.6-6.6-4-11.4-9.6-13.4l-4 2 2.4 11.4Z"
        fill="#16233a"/>

  <!-- الوجه -->
  <path d="M21.4 33.6c0-5 4.7-8.6 10.6-8.6s10.6 3.6 10.6 8.6v3.6c0 6.4-4.7 11-10.6 11s-10.6-4.6-10.6-11Z"
        fill="url(#face)"/>
  <!-- الأذنان -->
  <path d="M21 36.2c-2 0-3.2 1.5-3.2 3.6s1.2 3.6 3.2 3.6Z" fill="#e0b489"/>
  <path d="M43 36.2c2 0 3.2 1.5 3.2 3.6S45 43.4 43 43.4Z" fill="#e0b489"/>
  <!-- الحاجبان والعينان -->
  <g fill="#2b2118">
    <path d="M24.6 34.4c1.5-1.4 4.2-1.5 5.8-.3l-.7 1.5c-1.3-.9-3.3-.8-4.5.1Z"/>
    <path d="M39.4 34.4c-1.5-1.4-4.2-1.5-5.8-.3l.7 1.5c1.3-.9 3.3-.8 4.5.1Z"/>
    <circle cx="27.4" cy="38" r="1.7"/>
    <circle cx="36.6" cy="38" r="1.7"/>
  </g>
  <!-- الأنف والفم -->
  <path d="M32 38.8v3.4" stroke="#c98f63" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M28.8 45.4c2.1 1.5 4.3 1.5 6.4 0" stroke="#8d4b3a" stroke-width="1.4"
        stroke-linecap="round" fill="none"/>

  <!-- الكاب العسكري: القبة ثم الباند الذهبي ثم المظلة فوق الجبهة -->
  <path d="M13.2 25.4c0-9.6 8-16.6 18.8-16.6s18.8 7 18.8 16.6Z" fill="url(#cap)"/>
  <path d="M12.6 25.2h38.8c1.7 0 2.6 1.2 2.3 2.7l-.5 2.5H10.8l-.5-2.5c-.3-1.5.6-2.7 2.3-2.7Z"
        fill="#0b1220"/>
  <rect x="12" y="24.6" width="40" height="2.4" rx="1.2" fill="url(#gold)"/>
  <!-- الشارة الأمامية على القبة -->
  <path d="M32 8.6l6 2.6v3.2c0 2.6-2.5 4.9-6 5.6-3.5-.7-6-3-6-5.6v-3.2Z" fill="url(#gold)"/>
  <path d="M32 11l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4Z" fill="#0b1220"/>
  <!-- المظلة (النصلة) — أعلى الجبهة ولا تغطي العينين -->
  <path d="M8.6 30.4h46.8c1.3 0 2 1 1.5 2.2-.9 2.2-3.5 3.6-6.8 3.6H13.9c-3.3 0-5.9-1.4-6.8-3.6-.5-1.2.2-2.2 1.5-2.2Z"
        fill="#050b16"/>
  <path d="M11.4 34.6h41.2c-1.1.9-3 1.5-5.6 1.5H17c-2.6 0-4.5-.6-5.6-1.5Z" fill="#1e293b"/>
</svg>
