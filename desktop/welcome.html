<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مخازن التعيينات</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b131b;color:#dce5e8;font-family:"Segoe UI",Tahoma,sans-serif;height:100vh}.bar{height:39px;border-bottom:1px solid #ffffff0a;display:flex;align-items:center;padding:0 15px;color:#7c929e;font-size:11px;gap:10px}.bar span{flex:1}.bar button{border:0;background:none;color:#96a6b0;font-size:20px;cursor:pointer}.stage{height:calc(100vh - 39px);display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#152d3644,transparent 65%)}.card{max-width:580px;padding:50px}.mark{width:85px;height:85px;margin:0 auto 30px;border-radius:23px;border:1px solid #d4b77b33;background:#d4b77b0b;display:grid;place-items:center;transform:rotate(10deg)}.mark svg{width:46px;height:46px;transform:rotate(-10deg)}h1{font-size:30px;margin-bottom:10px}p{color:#859eac;line-height:2;font-size:14px}.eyebrow{letter-spacing:3px;font-size:10px;color:#bc9e66}.buttons{display:flex;gap:12px;justify-content:center;margin:26px 0}button{font:inherit;cursor:pointer}button.primary,button.secondary{border:1px solid #ffffff17;border-radius:9px;padding:13px 22px;font-size:13px;font-weight:600;background:#152630;color:#bfcdd3}button.primary{background:#d2b57b;color:#10212b;border-color:#d2b57b}.note{font-size:11px;color:#577581}.loading{height:3px;width:180px;background:#ffffff09;margin:30px auto;overflow:hidden;border-radius:3px}.loading::after{content:"";display:block;width:45%;height:100%;background:#c9ab74;animation:progress 1.2s ease-in-out infinite alternate}@keyframes progress{to{transform:translateX(-130%)}}#error{background:#c5595911;color:#d5a6a0;border:1px solid #d67b7b22;border-radius:10px;padding:15px;font-size:13px;line-height:2;white-space:pre-wrap;text-align:right}[hidden]{display:none!important}
</style></head><body><div class="bar"><span class="pywebview-drag-region">مخازن التعيينات · __VERSION__</span><button onclick="window.pywebview?.api.window_action('close')" aria-label="إغلاق">×</button></div><main class="stage"><section class="card"><div class="mark"><svg viewBox="0 0 64 64" fill="none" stroke="#d7b778" stroke-width="2"><path d="m32 8 23 13v28L32 62 9 49V21Zm0 27v27M9 21l23 14 23-14M20 15l23 14v15"/></svg></div><span class="eyebrow">LOGISTICS WORKSPACE</span><h1>بداية أكثر تنظيمًا.</h1><p id="message">مرحبًا بك في مخازن التعيينات.<br>ابدأ مساحة جديدة، أو انسخ بيانات نسختك القديمة بأمان.</p><div id="actions" class="buttons"><button class="primary" onclick="begin()">بدء مساحة جديدة</button><button class="secondary" onclick="importData()">استيراد بياناتي القديمة</button></div><div id="loading" class="loading" hidden></div><p id="error" hidden role="alert"></p><p class="note">بياناتك محلية. التحديث وإلغاء التثبيت لا يحذفانها.</p></section></main><script>
function busy(){document.getElementById('actions').hidden=true;document.getElementById('loading').hidden=false;document.getElementById('message').textContent='نجهّز مساحة عملك، لحظات قليلة…';}
function showError(message){document.getElementById('loading').hidden=true;let e=document.getElementById('error');e.textContent=message;e.hidden=false;}
async function begin(){busy();try{await window.pywebview.api.begin_new();}catch(e){showError('تعذّر التشغيل. راجع سجل البرنامج.');}}
async function importData(){try{const r=await window.pywebview.api.choose_old_data();if(r.error)showError(r.error);}catch(e){showError('تعذّر استيراد البيانات؛ المصدر لم يتغير.');}}
window.addEventListener('pywebviewready',function(){if(__EXISTING__)begin();});
</script></body></html>
