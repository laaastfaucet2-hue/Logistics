<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مخازن التعيينات</title>
  <style>__STYLES__</style>
</head>
<body>
  <div class="bar">
    <span class="pywebview-drag-region">مخازن التعيينات · __VERSION__</span>
    <button type="button" onclick="window.pywebview?.api.window_action('close')" aria-label="إغلاق">
      <svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg>
    </button>
  </div>
  <main class="stage"><section class="card">
    <div class="mark">__MARK__</div>
    <span class="eyebrow">LOGISTICS WORKSPACE</span>
    <h1>بداية أكثر تنظيمًا.</h1>
    <p id="message">مرحبًا بك في مخازن التعيينات.<br>ابدأ مساحة جديدة، أو انسخ بيانات نسختك القديمة بأمان.</p>
    <div id="actions" class="buttons">
      <button type="button" class="btn-gold" onclick="begin()">بدء مساحة جديدة</button>
      <button type="button" class="btn-ghost" onclick="importData()">استيراد بياناتي القديمة</button>
    </div>
    <div id="loading" class="loading" hidden></div>
    <p id="error" hidden role="alert"></p>
    <p class="note">بياناتك محلية. التحديث وإلغاء التثبيت لا يحذفانها.</p>
  </section></main>
  <script>
    function busy() {
      document.getElementById('actions').hidden = true;
      document.getElementById('loading').hidden = false;
      document.getElementById('message').textContent = 'نجهّز مساحة عملك، لحظات قليلة…';
    }
    function showError(message) {
      document.getElementById('loading').hidden = true;
      const error = document.getElementById('error');
      error.textContent = message;
      error.hidden = false;
    }
    async function begin() {
      busy();
      try { await window.pywebview.api.begin_new(); }
      catch (error) { showError('تعذّر التشغيل. راجع سجل البرنامج.'); }
    }
    async function importData() {
      try {
        const result = await window.pywebview.api.choose_old_data();
        if (result.error) showError(result.error);
      } catch (error) { showError('تعذّر استيراد البيانات؛ المصدر لم يتغير.'); }
    }
    window.addEventListener('pywebviewready', function () { if (__EXISTING__) begin(); });
  </script>
</body>
</html>
