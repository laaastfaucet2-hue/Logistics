{% macro icon(name, cls='') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name in ['mojandeen','recruits','people'] %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>
{% elif name in ['letterhead','file','supply_records','contractor_records','tameedat','contractor_invoices'] %}<path d="M14 3H5v18h14V8Z M14 3v5h5M8 12h8M8 16h6"/>
{% elif name in ['statistics','chart'] %}<path d="M4 3v18h17M8 16v-5m5 5V6m5 10v-8"/>
{% elif name in ['backups','shield'] %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z M8 12l3 3 5-6"/>
{% elif name in ['calc2','grid','dashboard'] %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'arrow' %}<path d="M19 12H5m6-6-6 6 6 6"/>
{% elif name == 'folder' %}<path d="M3 6h7l2 3h9v12H3Z M3 6V3h7l2 3h9v3"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'save' %}<path d="M4 3h12l4 4v14H4ZM8 3v6h8V3M8 21v-8h8v8"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5m3-8h9m-4-4 4 4-4 4"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18m-12 4h3m3 0h3"/>
{% else %}<path d="m12 3 9 5v10l-9 5-9-5V8Zm0 10v10M3 8l9 5 9-5M7 5.8l10 5.5"/>
{% endif %}</svg>
{%- endmacro %}
